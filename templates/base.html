<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestió Finca Ametllers</title>
    <!-- Bootstrap per a que sigui ràpid i adaptat a l'ús al camp amb mòbil -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
        }

        .navbar {
            background-color: #2e7d32;
        }

        /* Verd camp */
    </style>
</head>

<body>
    <nav class="navbar navbar-expand-lg navbar-dark mb-4 sticky-top">
        <div class="container">
            <a class="navbar-brand" href="/">🌳 Els Ametllers de Casa Rita</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                {% if current_user.is_authenticated %}
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="{{ url_for('index') }}">Inici</a></li>
                    <li class="nav-item"><a class="nav-link" href="{{ url_for('history') }}">📋 Historial</a></li>
                    <li class="nav-item"><a class="nav-link" href="{{ url_for('reports') }}">📊 Informes</a></li>
                    <li class="nav-item"><a class="nav-link" href="{{ url_for('vegga') }}">💧 Reg (Vegga)</a></li>
                    <li class="nav-item"><a class="nav-link" href="{{ url_for('logout') }}">🚪 Sortir</a></li>
                </ul>
                {% endif %}
            </div>
        </div>
    </nav>
    <div class="container">
        {% block content %}{% endblock %}
    </div>
</body>

</html>
