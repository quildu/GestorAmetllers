{% extends "base.html" %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h1>🗂️ Parcel·les</h1>
</div>

<div class="row g-4 mb-5">
    {% for p in parcels %}
    <div class="col-md-4">
        <a href="{{ url_for('index', parcel_id=p.id) }}" class="text-decoration-none text-reset">
            <div class="card shadow h-100">
                <div class="card-body">
                    <h4 class="card-title">🌳 {{ p.name }}</h4>
                    <p class="mb-1 text-success">Ingressos: <strong>{{ "%.2f"|format(p.income_total) }} €</strong></p>
                    <p class="mb-0 text-danger">Despeses: <strong>{{ "%.2f"|format(p.expenses_total) }} €</strong></p>
                </div>
            </div>
        </a>
    </div>
    {% endfor %}
</div>

{% if current_user.is_admin %}
<div class="card shadow">
    <div class="card-header bg-dark text-white"><h5 class="mb-0">➕ Nova parcel·la</h5></div>
    <div class="card-body">
        <form action="{{ url_for('add_parcel') }}" method="post" class="row g-2 align-items-end">
            <div class="col-md-8">
                <label class="form-label">Nom de la parcel·la</label>
                <input type="text" class="form-control" name="name" placeholder="Ex: Els Plans" required>
            </div>
            <div class="col-md-4">
                <button type="submit" class="btn btn-success w-100">Crear parcel·la</button>
            </div>
        </form>
    </div>
</div>
{% endif %}
{% endblock %}
