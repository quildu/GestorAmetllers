{% extends "base.html" %}
{% block content %}
<div class="card shadow mb-4">
    <div class="card-header bg-warning text-dark">
        <h2>👨‍🌾 {% if item %}Editar{% else %}Registrar{% endif %} Treball / Jornal</h2>
    </div>
    <div class="card-body">
        <form action="{{ url_for('edit_labor', id=item.id) if item else url_for('add_labor') }}" method="post" enctype="multipart/form-data">
            <div class="mb-3">
                <label class="form-label">Data</label>
                <div class="row g-2">
                    <div class="col-4">
                        <select name="day" class="form-select" required>
                            <option value="" disabled {% if not item %}selected{% endif %}>Dia</option>
                            {% for d in days %}
                            <option value="{{ d }}" {% if (item_date and item_date.day == d) %}selected{% endif %}>{{ d }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="col-4">
                        <select name="month" class="form-select" required>
                            <option value="" disabled {% if not item %}selected{% endif %}>Mes</option>
                            {% for m_val, m_name in months %}
                            <option value="{{ m_val }}" {% if (item_date and item_date.month == m_val) %}selected{% endif %}>{{ m_name }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="col-4">
                        <select name="year" class="form-select" required>
                            {% for y in years %}
                            <option value="{{ y }}" {% if (item_date and item_date.year == y) or (not item and y == current_year) %}selected{% endif %}>{{ y }}</option>
                            {% endfor %}
                        </select>
                    </div>
                </div>
            </div>
            
            <div class="mb-3">
                <label for="worker_id" class="form-label">Treballador</label>
                <div class="input-group">
                    <select class="form-select" id="worker_id" name="worker_id" required>
                        <option value="" selected disabled>Tria un treballador...</option>
                        {% for w in workers %}
                        <option value="{{ w.id }}" {% if item and item.worker_id == w.id %}selected{% endif %}>{{ w.name }}</option>
                        {% endfor %}
                    </select>
                    <button class="btn btn-outline-secondary" type="button" data-bs-toggle="modal" data-bs-target="#addWorkerModal">+</button>
                </div>
            </div>

            <div class="mb-3">
                <label for="labor_type_id" class="form-label">Tipus de feina</label>
                <div class="input-group">
                    <select class="form-select" id="labor_type_id" name="labor_type_id" required>
                        <option value="" selected disabled>Tria tipus de feina...</option>
                        {% for lt in labor_types %}
                        <option value="{{ lt.id }}" {% if item and item.labor_type_id == lt.id %}selected{% endif %}>{{ lt.name }}</option>
                        {% endfor %}
                    </select>
                    <button class="btn btn-outline-secondary" type="button" data-bs-toggle="modal" data-bs-target="#addLaborTypeModal">+</button>
                </div>
            </div>

            <div class="row">
                <div class="col-md-6 mb-3">
                    <label for="hours" class="form-label">Hores</label>
                    <input type="number" step="0.5" class="form-control" id="hours" name="hours" value="{{ item.hours if item else '' }}" required>
                </div>
                <div class="col-md-6 mb-3">
                    <label for="price_per_hour" class="form-label">Preu/Hora (€)</label>
                    <input type="number" step="0.01" class="form-control" id="price_per_hour" name="price_per_hour" value="{{ item.price_per_hour if item else '' }}" required>
                </div>
            </div>

            <div class="mb-3">
                <label for="description" class="form-label">Notes (opcional)</label>
                <input type="text" class="form-control" id="description" name="description" value="{{ item.description if item else '' }}">
            </div>

            {% include '_documents_section.html' %}

            <div class="d-grid gap-2">
                <button type="submit" class="btn btn-warning btn-lg">{% if item %}Actualitzar{% else %}Desar{% endif %} Treball</button>
                <a href="{{ url_for('index') }}" class="btn btn-outline-secondary">Enrere</a>
            </div>
        </form>
    </div>
</div>

<div class="modal fade" id="addWorkerModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <form id="quickAddWorkerForm">
                <div class="modal-header"><h5>Nou Treballador</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
                <div class="modal-body"><input type="text" name="name" class="form-control" placeholder="Nom complet" required></div>
                <div class="modal-footer"><button type="submit" class="btn btn-primary">Afegir</button></div>
            </form>
        </div>
    </div>
</div>

<div class="modal fade" id="addLaborTypeModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <form id="quickAddLaborTypeForm">
                <div class="modal-header"><h5>Nou Tipus de Feina</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
                <div class="modal-body"><input type="text" name="name" class="form-control" placeholder="Ex: Desbrossar" required></div>
                <div class="modal-footer"><button type="submit" class="btn btn-primary">Afegir</button></div>
            </form>
        </div>
    </div>
</div>

<!-- Incloure JS de Bootstrap per als modals -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script>
async function handleQuickAdd(formId, endpoint, selectId) {
    const form = document.getElementById(formId);
    form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const formData = new FormData(form);
        try {
            const response = await fetch(endpoint, {
                method: 'POST',
                body: formData
            });
            const data = await response.json();
            if (data.success) {
                const select = document.getElementById(selectId);
                const option = new Option(data.name, data.id);
                select.add(option);
                select.value = data.id; // Seleccionar el nou
                
                // Tancar el modal
                const modalEl = document.getElementById(form.closest('.modal').id);
                const modal = bootstrap.Modal.getInstance(modalEl);
                modal.hide();
                form.reset();
            } else {
                alert('Error: ' + data.error);
            }
        } catch (err) {
            console.error(err);
            alert('Error de connexió');
        }
    });
}

handleQuickAdd('quickAddWorkerForm', '/master/worker/add', 'worker_id');
handleQuickAdd('quickAddLaborTypeForm', '/master/labor_type/add', 'labor_type_id');
</script>
{% endblock %}
