services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./db:/app/db
      - ./documents:/app/documents
    expose:
      - "5000"

  # Comprovacio diaria del cabal de reg per sector (avisos per Telegram)
  monitor:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      - TZ=Europe/Madrid
      - PYTHONUNBUFFERED=1
    volumes:
      - ./db:/app/db
    command: ["python", "scripts/check_irrigation.py", "--daemon"]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - app
    env_file: .env
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
